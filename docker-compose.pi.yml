include:
  - docker-compose.ollama.yml
  - docker-compose.pi.build.yml

services:
  pi:
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - USER=ubuntu
      - HOME=/home/ubuntu
      - UV_OFFLINE=1
      - UV_NO_SYNC=1
      - UV_PYTHON_DOWNLOADS=never
    volumes:
      - ${WORKSPACE_DIR:?WORKSPACE_DIR must be set in .env}:/workspace
      - ./pi-config:/home/ubuntu/.pi-defaults:ro
      - pi_agents:/home/ubuntu/.pi
    working_dir: /workspace

volumes:
  pi_agents:
