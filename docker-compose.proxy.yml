x-litellm-image: &litellm-image litellm/litellm:1.84.0

services:
  litellm:
    image: *litellm-image
    container_name: litellm
    command: ["--config", "/app/litellm_config.yaml", "--port", "4000"]
    volumes:
      - ./proxy-config/litellm_config.yaml:/app/litellm_config.yaml:ro
      - litellm_data:/root/.config/litellm
    env_file:
      - path: .env.proxy
        required: false
    networks:
      - pi_net
      - proxy_ext
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  pi:
    depends_on:
      litellm:
        condition: service_healthy

volumes:
  litellm_data:

networks:
  pi_net:
    driver: bridge
    internal: true
  proxy_ext:
    driver: bridge
